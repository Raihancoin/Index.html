<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BITDEEN • BDC</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* ---------- BACKGROUND ---------- */
    body {
      background-image: url('bg-gold.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #000;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 0; overflow-x: hidden; position: relative;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.72);
      z-index: 0; pointer-events: none;
    }

    /* ---------- APP ---------- */
    .app {
      width: 100%; max-width: 430px;
      min-height: 100vh;
      background: rgba(0, 0, 0, 0.82);
      border: 1.5px solid rgba(255, 215, 0, 0.6);
      box-shadow: 0 0 80px rgba(255, 215, 0, 0.2);
      position: relative; z-index: 5;
      overflow: hidden; display: flex; flex-direction: column;
    }

    .screen {
      flex: 1; overflow-y: auto; overflow-x: hidden;
      padding: 14px 14px 90px;
      scrollbar-width: none; -ms-overflow-style: none;
      display: flex; flex-direction: column; gap: 12px;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* ---------- TOP HEADER ---------- */
    .top-header {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 8px; align-items: center;
    }

    .level-box {
      background: linear-gradient(145deg, #1a1205, #000);
      border: 1.5px solid rgba(255, 215, 0, 0.7);
      border-radius: 16px;
      padding: 8px 6px; text-align: center;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.2), inset 0 0 15px rgba(255, 215, 0, 0.05);
    }
    .level-box .laurel { font-size: 10px; color: #ffd700; text-shadow: 0 0 6px rgba(255, 215, 0, 1); }
    .level-box .lv-title {
      font-size: 9px; color: #00ffff; font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
    }
    .level-box .lv-num {
      font-size: 20px; font-weight: 900; color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 215, 0, 1), 0 2px 4px rgba(0,0,0,1);
      line-height: 1; margin: 2px 0;
    }
    .level-box .lv-bar {
      width: 100%; height: 4px;
      background: rgba(255, 215, 0, 0.2);
      border-radius: 10px; overflow: hidden; margin: 4px 0 2px;
    }
    .level-box .lv-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffaa00);
      border-radius: 10px;
      box-shadow: 0 0 8px rgba(255, 215, 0, 1);
      transition: width 0.5s ease;
    }
    .level-box .lv-sub { font-size: 8px; color: #c0c0c0; font-weight: 700; }

    .brand-box { text-align: center; }
    .brand-box .crown {
      font-size: 16px;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 1));
    }
    .brand-box .brand-name {
      font-size: 22px; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(180deg, #fff5cc, #ffd700, #b8860b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 1)) drop-shadow(0 2px 3px rgba(0,0,0,1));
      line-height: 1;
    }
    .brand-box .brand-sub {
      font-size: 11px; color: #ffd700; font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 1);
      margin-top: -2px;
    }

    .wallet-box {
      background: linear-gradient(145deg, #1a1205, #000);
      border: 1.5px solid rgba(255, 215, 0, 0.7);
      border-radius: 16px;
      padding: 8px 6px; text-align: center;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.2), inset 0 0 15px rgba(255, 215, 0, 0.05);
    }
    .wallet-box .w-icon { font-size: 14px; }
    .wallet-box .w-title {
      font-size: 11px; color: #ffffff; font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 1);
    }
    .wallet-box .w-status {
      font-size: 9px; color: #00ff88; font-weight: 900;
      text-shadow: 0 0 8px rgba(0, 255, 136, 1);
      display: flex; align-items: center; justify-content: center; gap: 4px;
      margin-top: 2px;
    }
    .wallet-box .w-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #00ff88; box-shadow: 0 0 8px #00ff88;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .referred-by {
      text-align: center;
      display: flex; flex-direction: column; align-items: center;
      gap: 4px; margin: 4px 0;
    }
    .referred-by .rb-label {
      font-size: 10px; color: #00ffff; font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 1);
      display: flex; align-items: center; gap: 8px;
    }
    .referred-by .rb-label::before,
    .referred-by .rb-label::after {
      content: '';
      width: 25px; height: 1px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
    }
    .referred-by .rb-user {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: #ffffff; font-weight: 800;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
    }
    .referred-by .rb-avatar {
      width: 26px; height: 26px; border-radius: 50%;
      background: linear-gradient(145deg, #ffd700, #b8860b);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }

    .main-balance {
      background: linear-gradient(180deg, #1a1205, #000);
      border: 2px solid rgba(255, 215, 0, 0.8);
      border-radius: 20px;
      padding: 14px 12px;
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      align-items: center; gap: 8px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.25), inset 0 0 25px rgba(255, 215, 0, 0.05);
      position: relative; overflow: hidden;
    }
    .main-balance::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
    }
    .main-balance .icon-side {
      font-size: 34px;
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.9));
      text-align: center;
    }
    .main-balance .mb-center { text-align: center; }
    .main-balance .mb-label {
      font-size: 11px; color: #00ffff; font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 1);
    }
    .main-balance .mb-value {
      font-size: 24px; font-weight: 900;
      background: linear-gradient(180deg, #fff5cc, #ffd700, #b8860b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 1));
      line-height: 1.1; margin: 2px 0;
    }
    .main-balance .mb-unit {
      font-size: 12px; color: #ffd700; font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 1);
    }

    .coin-section {
      display: flex; justify-content: center; align-items: center;
      padding: 4px 0; position: relative;
    }
    .coin-wrapper {
      width: 160px; height: 160px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      position: relative;
      animation: floatCoin 4s ease-in-out infinite;
    }
    .coin-wrapper::before {
      content: '';
      position: absolute; inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 215, 0, 0.5), transparent 70%);
      filter: blur(20px);
      z-index: 0;
    }
    .coin-wrapper img {
      width: 100%; height: 100%; object-fit: contain;
      border-radius: 50%;
      position: relative; z-index: 1;
      filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.9)) drop-shadow(0 8px 16px rgba(0, 0, 0, 1));
    }
    .coin-fallback {
      width: 100%; height: 100%; border-radius: 50%;
      background: radial-gradient(circle at 30% 25%, #fff5cc, #ffd700 40%, #b8860b 70%, #6b4f00 100%);
      display: flex; align-items: center; justify-content: center;
      font-size: 44px; font-weight: 900; color: #3d2e00;
      text-shadow: 2px 2px 0 rgba(255,255,255,0.5), -1px -1px 0 rgba(0,0,0,0.5);
      border: 6px solid #ffd700;
      box-shadow: 
        0 0 40px rgba(255, 215, 0, 1),
        0 0 80px rgba(255, 215, 0, 0.5),
        inset 0 0 30px rgba(139, 90, 0, 0.8),
        inset 0 5px 20px rgba(255, 255, 255, 0.3);
      position: relative; z-index: 1; letter-spacing: 2px;
    }
    @keyframes floatCoin {
      0%,100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    .boost-row {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px; align-items: center;
    }
    .boost-card {
      background: linear-gradient(180deg, #1a1205, #000);
      border: 1.5px solid rgba(255, 215, 0, 0.7);
      border-radius: 16px;
      padding: 12px 10px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.15), inset 0 0 15px rgba(255, 215, 0, 0.05);
    }
    .boost-card .b-head {
      font-size: 10px; color: #00ffff; font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
      display: flex; align-items: center; justify-content: center; gap: 4px;
    }
    .boost-card .b-icon {
      font-size: 14px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 1));
    }
    .boost-card .b-value {
      font-size: 24px; font-weight: 900;
      background: linear-gradient(180deg, #fff5cc, #ffd700, #b8860b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 1));
      line-height: 1.1; margin: 2px 0;
    }
    .boost-card .b-unit {
      font-size: 10px; color: #ffd700; font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(255, 215, 0, 1);
    }
    .boost-card.extra .b-value {
      background: linear-gradient(180deg, #a8ffcc, #00ff88, #008844);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 10px rgba(0, 255, 136, 1));
    }
    .boost-card.extra .b-unit {
      color: #00ff88;
      text-shadow: 0 0 8px rgba(0, 255, 136, 1);
    }
    .boost-card .b-timer {
      font-size: 10px; color: #ffd700; font-weight: 800;
      text-shadow: 0 0 6px rgba(255, 215, 0, 1);
      margin-top: 4px;
      display: flex; align-items: center; justify-content: center; gap: 3px;
    }
    .plus-sign {
      font-size: 24px; font-weight: 900; color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 1);
    }

    .speed-bar {
      background: linear-gradient(180deg, #1a1205, #000);
      border: 1.5px solid rgba(255, 215, 0, 0.6);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
    }
    .speed-bar .sb-item {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-weight: 900;
    }
    .speed-bar .sb-label {
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
    }
    .speed-bar .sb-value {
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 1);
    }
    .speed-bar .divider {
      width: 1px; height: 16px;
      background: linear-gradient(180deg, transparent, #ffd700, transparent);
    }

    .mining-balance {
      background: linear-gradient(180deg, #1a1205, #000);
      border: 2px solid rgba(255, 215, 0, 0.8);
      border-radius: 20px;
      padding: 14px 12px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.25), inset 0 0 25px rgba(255, 215, 0, 0.05);
      position: relative; overflow: hidden;
    }
    .mining-balance::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #ffd700, transparent);
    }
    .mb-row {
      display: grid;
      grid-template-columns: 50px 1fr 50px;
      align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .mb-row .icon-side {
      font-size: 36px;
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.9));
      text-align: center;
    }
    .mb-center { text-align: center; }
    .mb-center .mb-label2 {
      font-size: 11px; color: #00ffff; font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 1);
    }
    .mb-center .mb-value2 {
      font-size: 24px; font-weight: 900;
      background: linear-gradient(180deg, #fff5cc, #ffd700, #b8860b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 12px rgba(255, 215, 0, 1));
      line-height: 1.1; margin: 2px 0;
    }
    .mb-center .mb-unit2 {
      font-size: 12px; color: #ffd700; font-weight: 900;
      letter-spacing: 3px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 1);
    }

    .claim-btn {
      width: 100%; padding: 16px;
      border-radius: 14px;
      border: 2px solid #fff5cc;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000;
      font-size: 22px; font-weight: 900;
      letter-spacing: 4px; text-transform: uppercase;
      cursor: pointer;
      box-shadow: 
        0 0 30px rgba(255, 215, 0, 0.8),
        0 8px 20px rgba(0, 0, 0, 1),
        inset 0 2px 0 rgba(255, 255, 255, 0.6);
      display: flex; align-items: center; justify-content: center; gap: 10px;
      text-shadow: 0 1px 1px rgba(255, 255, 255, 0.5);
      transition: all 0.15s ease;
      position: relative; overflow: hidden;
    }
    .claim-btn::before {
      content: '';
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.6), transparent);
      animation: shine 3s infinite;
    }
    @keyframes shine {
      0% { left: -100%; }
      50%,100% { left: 200%; }
    }
    .claim-btn:active {
      transform: scale(0.97);
      box-shadow: 0 0 50px rgba(255, 215, 0, 1), 0 4px 10px rgba(0, 0, 0, 1);
    }
    .claim-btn .coin-icon {
      font-size: 24px;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
    }
    .claim-note {
      text-align: center;
      font-size: 11px; color: #c0c0c0; font-weight: 700;
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.5), 0 2px 4px rgba(0,0,0,1);
      margin-top: 8px; letter-spacing: 0.5px;
    }

    .social-box {
      background: linear-gradient(180deg, #1a1205, #000);
      border: 1.5px solid rgba(255, 215, 0, 0.6);
      border-radius: 16px;
      padding: 12px 14px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
    }
    .social-box .sc-label {
      font-size: 10px; color: #00ffff; font-weight: 900;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 1);
      margin-bottom: 6px;
    }
    .social-row {
      display: flex; gap: 8px;
    }
    .social-input {
      flex: 1; padding: 10px 14px;
      border-radius: 40px;
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.9);
      font-size: 12px; outline: none;
      color: #ffffff; font-weight: 700;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 1);
    }
    .social-input::placeholder { color: rgba(0, 255, 255, 0.5); }
    .social-input:focus {
      border-color: #00ffff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
    }
    .social-btn {
      padding: 10px 18px;
      border-radius: 40px;
      border: 1.5px solid #fff5cc;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000;
      font-weight: 900; font-size: 11px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .social-btn:active { transform: scale(0.95); }

    .bottom-nav {
      position: sticky; bottom: 0;
      display: flex; gap: 4px;
      padding: 8px 8px 12px;
      background: rgba(0, 0, 0, 1);
      border-top: 1.5px solid rgba(255, 215, 0, 0.6);
      justify-content: space-around; z-index: 20;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 1);
    }
    .nav-btn {
      flex: 1; padding: 10px 4px; border-radius: 14px;
      border: 1px solid transparent;
      font-weight: 900; font-size: 9px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s ease;
      background: transparent;
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
      letter-spacing: 0.5px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
    }
    .nav-btn .nav-icon {
      font-size: 18px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8));
    }
    .nav-btn.active {
      background: linear-gradient(180deg, #1a1205, #000);
      border: 1.5px solid rgba(255, 215, 0, 0.7);
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
      color: #ffd700;
      text-shadow: 0 0 8px rgba(255, 215, 0, 1);
    }
    .nav-btn:active { transform: scale(0.95); }

    .m-card {
      background: linear-gradient(180deg, #1a1205, #000);
      border: 1.5px solid rgba(255, 215, 0, 0.6);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.15);
    }
    .task-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px;
      background: linear-gradient(180deg, #1a1205, #000);
      border-radius: 14px; border: 1px solid rgba(255, 215, 0, 0.5);
      margin-bottom: 8px;
    }
    .task-left { display: flex; align-items: center; gap: 12px; }
    .task-rank {
      width: 34px; height: 34px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; flex-shrink: 0;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }
    .task-info { display: flex; flex-direction: column; }
    .task-name {
      font-weight: 800; font-size: 13px; color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }
    .task-sub {
      font-size: 10px; color: #00ffff; font-weight: 700;
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.8);
    }
    .task-reward {
      font-weight: 900; font-size: 12px; color: #000;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      padding: 6px 12px; border-radius: 40px;
      border: 1px solid #fff5cc;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      cursor: pointer;
    }
    .task-reward:active { transform: scale(0.95); }
    .task-reward:disabled { opacity: 0.5; }

    .booster-card {
      background: linear-gradient(180deg, #1a1205, #000);
      border: 1.5px solid rgba(255, 215, 0, 0.7);
      border-radius: 18px;
      padding: 16px; margin-bottom: 12px;
      text-align: center;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
    }
    .booster-icon {
      font-size: 36px; margin-bottom: 6px;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.9));
    }
    .booster-title {
      font-size: 15px; font-weight: 900; color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.6); margin-bottom: 4px;
    }
    .booster-desc {
      font-size: 11px; color: #00ffff; font-weight: 700;
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.6); margin-bottom: 12px;
    }
    .booster-btn {
      padding: 10px 24px; border-radius: 40px;
      border: 1.5px solid #fff5cc;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000; font-weight: 900; font-size: 12px;
      text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      cursor: pointer;
    }
    .booster-btn:active { transform: scale(0.95); }
    .booster-btn:disabled { opacity: 0.5; }

    .ref-link-box {
      background: rgba(0, 0, 0, 0.9);
      border-radius: 40px; padding: 12px; margin: 10px 0;
      font-size: 12px; font-weight: 700; color: #ffffff;
      word-break: break-all;
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.5);
      text-align: center;
    }

    .profile-avatar {
      width: 80px; height: 80px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      margin: 0 auto 12px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.7), 0 0 0 3px rgba(255, 215, 0, 0.5);
    }

    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000; padding: 12px 24px; border-radius: 40px;
      font-weight: 900; font-size: 13px;
      box-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 12px 30px rgba(0, 0, 0, 1);
      z-index: 200; animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
      pointer-events: none; white-space: nowrap;
      text-shadow: 0 1px 1px rgba(255,255,255,0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
  </style>
</head>

<script>
const CONFIG = {
  baseRate: 0.00000001,
  dailyCheckinReward: 8,
  checkinIntervalHours: 8,
  referralRewardSpeed: 10,
  socialCodeReward: 1,
  initialSpeed: 10,
  extraBoostSpeed: 5,
  extraBoostDuration: 12 * 60 * 60,
  demoWallet: "DemoWallet...9XK2",
  demoUsername: "BDC Explorer",
  demoTelegramId: "tg_72839401",
  referredBy: "@username",
  logoUrl: "bdc-logo.png",
};

let state = {
  mainBalance: 1234.567890,
  miningBalance: 0,
  level: 1,
  levelProgress: 0,
  levelTarget: 100,
  totalBoost: 25.00,
  extraBoost: 5.00,
  extraBoostEndTime: null,
  baseSpeed: 10.00,
  totalSpeed: 25.00,
  referralCount: 0,
  totalReferralSpeed: 0,
  checkinSpeed: 0,
  lastCheckin: null,
  usedCodes: [],
  currentTab: 'home',
  miningInterval: null,
  timerInterval: null,
};

const LEVEL_NAMES = [
  "Bronze Dawn", "Golden Spark", "Auric Trail", "Copper Gleam", "Silver Ray",
  "Gold Whisper", "Amber Rise", "Pearl Light", "Opal Glow", "Topaz Shine",
  "Ruby Flame", "Sapphire Star", "Emerald Leaf", "Diamond Dust", "Platinum Pulse",
  "Titanium Will", "Celestial Gold", "Radiant Crest", "Luminous Path", "Noble Ember",
  "Royal Sparkle", "Imperial Glow", "Sovereign Light", "Majestic Gleam", "Regal Aura",
  "Gilded Horizon", "Golden Summit", "Auric Peak", "Crown Jewel", "Throne of Gold",
  "Scepter Shine", "Diadem Ray", "Orb of Fortune", "Chalice of Light", "Grail of Gold",
  "Phoenix Feather", "Dragon Scale", "Griffin Wing", "Unicorn Horn", "Pegasus Flight",
  "Star Forge", "Sun Smith", "Moon Weaver", "Comet Chaser", "Nebula Navigator",
  "Galaxy Guardian", "Cosmic Crown", "Astral Aura", "Stellar Spark", "Nova Glow",
  "Eclipse Shade", "Solstice Light", "Equinox Balance", "Zodiac Gold", "Orion's Belt",
  "Sirius Flame", "Vega Shine", "Polaris Star", "Andromeda Ray", "Milky Way",
  "Infinity Loop", "Eternity Ring", "Forever Gold", "Legacy Light", "Heritage Gleam",
  "Dynasty Gold", "Empire Ember", "Kingdom Crown", "Realm Radiance", "Domain of Gold",
  "Fortress Flame", "Citadel Shine", "Bastion Glow", "Rampart Ray", "Keep of Gold",
  "Vanguard Gold", "Sentinel Spark", "Guardian Gleam", "Defender Light", "Protector Gold",
  "Champion Flame", "Victor's Gold", "Conqueror's Crown", "Triumph Light", "Victory Ray",
  "Legend Gold", "Mythic Flame", "Epic Shine", "Saga Glow", "Chronicle Gold",
  "Eternal Flame", "Immortal Gold", "Everlasting Light", "Timeless Gleam", "Perpetual Gold",
  "Elite Sovereign"
];
while (LEVEL_NAMES.length < 100) LEVEL_NAMES.push("Level " + (LEVEL_NAMES.length + 1));

const LEVELS = LEVEL_NAMES.map((name, i) => ({
  level: i + 1, name: name,
  requiredBDC: (i + 1) * 100,
  reward: (i + 1) * 0.5,
}));

function getCurrentLevel(balance) {
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (balance >= LEVELS[i].requiredBDC) return LEVELS[i];
  }
  return LEVELS[0];
}
function getNextLevel(currentLevel) {
  const idx = LEVELS.findIndex(l => l.level === currentLevel.level);
  return idx < LEVELS.length - 1 ? LEVELS[idx + 1] : null;
}

function saveState() {
  try {
    const toSave = { ...state };
    delete toSave.miningInterval;
    delete toSave.timerInterval;
    localStorage.setItem('bitdeen_state', JSON.stringify(toSave));
  } catch (e) { }
}
function loadState() {
  try {
    const saved = localStorage.getItem('bitdeen_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
      if (state.usedCodes === undefined) state.usedCodes = [];
    }
  } catch (e) { }
}

function startMining() {
  if (state.miningInterval) clearInterval(state.miningInterval);
  state.miningInterval = setInterval(() => {
    state.miningBalance += CONFIG.baseRate * state.totalSpeed;
    state.mainBalance += CONFIG.baseRate * state.totalSpeed * 0.1;
    
    const curLv = getCurrentLevel(state.mainBalance);
    if (curLv.level !== state.level) {
      state.level = curLv.level;
      showToast(`⭐ Level Up! ${curLv.name}`);
      saveState();
    }
    updateMiningUI();
    updateLevelUI();
    if (Math.random() < 0.05) saveState();
  }, 1000);
}

function startTimer() {
  if (state.timerInterval) clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    const el = document.getElementById('boostTimer');
    if (el && state.extraBoostEndTime) {
      const diff = state.extraBoostEndTime - Date.now();
      if (diff > 0) el.textContent = formatTime(diff);
      else {
        el.textContent = '00:00:00';
        state.extraBoost = 0;
        state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed;
      }
    }
  }, 1000);
}

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
  const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
  const s = String(totalSec % 60).padStart(2, '0');
  return `${h}:${m}:${s}`;
}

function claimMining() {
  if (state.miningBalance <= 0) {
    showToast('⛏️ Nothing to claim yet!');
    return;
  }
  state.mainBalance += state.miningBalance;
  const claimed = state.miningBalance;
  state.miningBalance = 0;
  saveState();
  updateMiningUI();
  showToast(`⛏️ Claimed ${claimed.toFixed(6)} BDC!`);
}

function doCheckin() {
  if (state.lastCheckin) {
    const hoursSince = (Date.now() - new Date(state.lastCheckin).getTime()) / (1000 * 60 * 60);
    if (hoursSince < CONFIG.checkinIntervalHours) {
      showToast('⏳ Already checked in.');
      return;
    }
  }
  state.lastCheckin = new Date().toISOString();
  state.checkinSpeed += CONFIG.dailyCheckinReward;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed + state.extraBoost;
  saveState();
  render();
  showToast(`✅ Check-in! +${CONFIG.dailyCheckinReward} SPEED`);
}

function activateBoost() {
  state.extraBoostEndTime = Date.now() + CONFIG.extraBoostDuration * 1000;
  state.extraBoost = CONFIG.extraBoostSpeed;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed + state.extraBoost;
  saveState();
  render();
  showToast('🚀 Extra Boost Activated!');
}

function addReferral() {
  state.referralCount += 1;
  state.totalReferralSpeed = state.referralCount * CONFIG.referralRewardSpeed;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed + state.extraBoost;
  saveState();
  render();
  showToast(`+1 Referral! +${CONFIG.referralRewardSpeed} SPEED`);
}

function claimSocialCode() {
  const input = document.getElementById('socialCodeInput');
  if (!input) return;
  const code = input.value.trim().toUpperCase();
  if (!code) { showToast('Please enter a code'); return; }
  if (state.usedCodes.includes(code)) { showToast('❌ Code already used'); return; }
  state.usedCodes.push(code);
  state.checkinSpeed += CONFIG.socialCodeReward;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed + state.extraBoost;
  saveState();
  input.value = '';
  render();
  showToast(`✅ Code claimed! +${CONFIG.socialCodeReward} SPEED`);
}

function render() {
  const container = document.getElementById('screenContainer');
  if (state.currentTab === 'home') container.innerHTML = getHomeHTML();
  else if (state.currentTab === 'tasks') container.innerHTML = getTasksHTML();
  else if (state.currentTab === 'booster') container.innerHTML = getBoosterHTML();
  else if (state.currentTab === 'referral') container.innerHTML = getReferralHTML();
  else if (state.currentTab === 'profile') container.innerHTML = getProfileHTML();
  updateMiningUI();
  updateLevelUI();
}

function updateLevelUI() {
  const curLv = getCurrentLevel(state.mainBalance);
  const el = document.getElementById('lvNum');
  const barEl = document.getElementById('lvBarFill');
  const subEl = document.getElementById('lvSub');
  if (el) el.textContent = curLv.level;
  if (barEl) {
    const nextLv = getNextLevel(curLv);
    const target = nextLv ? nextLv.requiredBDC : curLv.requiredBDC;
    const progress = Math.min(100, (state.mainBalance / target) * 100);
    barEl.style.width = progress + '%';
  }
  if (subEl) {
    const nextLv = getNextLevel(curLv);
    const target = nextLv ? nextLv.requiredBDC : curLv.requiredBDC;
    subEl.textContent = `${Math.floor(state.mainBalance)} / ${target} BDC`;
  }
}

        <div class="lv-num">${curLv.level}</div>

        <div class="lv-sub">${Math.floor(state.mainBalance)} / ${state.levelTarget} BDC</div>
      </div>
      <div class="brand-box">
        <div class="crown">👤</div>
        <div class="brand-name">PROFILE</div>
        <div class="brand-sub">YOUR ACCOUNT</div>
      </div>
      <div class="wallet-box">
        <div class="w-icon">💼</div>
        <div class="w-title">WALLET</div>
        <div class="w-status"><span class="w-dot"></span>Connected</div>
      </div>
    </div>

    <div class="m-card" style="text-align:center;">
      <div class="profile-avatar">🧑</div>
      <div style="font-size:18px;font-weight:900;color:#ffffff;text-shadow:0 0 10px rgba(255,215,0,0.6);">${CONFIG.demoUsername}</div>
      <div style="font-size:12px;color:#00ffff;text-shadow:0 0 8px rgba(0,255,255,1);font-weight:800;margin-top:4px;">TG: ${CONFIG.demoTelegramId}</div>
    </div>

    <div class="m-card">
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid rgba(0,255,255,0.2);">
        <span style="color:#00ffff;font-weight:800;">WALLET</span>
        <span style="color:#ffffff;font-weight:700;">${CONFIG.demoWallet}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid rgba(0,255,255,0.2);">
        <span style="color:#00ffff;font-weight:800;">LEVEL</span>
        <span style="color:#ffffff;font-weight:700;">${curLv.level} — ${curLv.name}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;border-bottom:1px solid rgba(0,255,255,0.2);">
        <span style="color:#00ffff;font-weight:800;">MAIN BALANCE</span>
        <span style="color:#ffffff;font-weight:700;">${state.mainBalance.toFixed(6)} BDC</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:8px 0;font-size:13px;">
        <span style="color:#00ffff;font-weight:800;">REFERRALS</span>
        <span style="color:#ffffff;font-weight:700;">${state.referralCount}</span>
      </div>
    </div>
  `;
}

function switchTab(tab) {
  state.currentTab = tab;
  saveState();
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  const map = { home: 'navHome', tasks: 'navTasks', booster: 'navBooster', referral: 'navReferral', profile: 'navProfile' };
  const el = document.getElementById(map[tab]);
  if (el) el.classList.add('active');
  render();
}

function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3000);
}

function init() {
  loadState();
  if (!state.extraBoostEndTime || state.extraBoostEndTime < Date.now()) {
    state.extraBoostEndTime = Date.now() + CONFIG.extraBoostDuration * 1000;
  }
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed + state.extraBoost;
  startMining();
  startTimer();
  render();
  setInterval(saveState, 5000);
}

init();

window.switchTab = switchTab;
window.claimMining = claimMining;
window.doCheckin = doCheckin;
window.activateBoost = activateBoost;
window.addReferral = addReferral;
window.claimSocialCode = claimSocialCode;
window.showToast = showToast;
</script>
</body>
</html>
