<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BITDEEN • BDC</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* ============================================================
       BACKGROUND IMAGE (আপনার ইমেজ এখানে বসবে)
       ============================================================ */
    body {
      background-image: url('bg-gold.jpg');   /* ← আপনার ইমেজের নাম */
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-color: #000;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* হালকা ডার্ক ওভারলে — লোগো ক্লিয়ার দেখার জন্য কম opacity */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(
        circle at 50% 45%,
        rgba(0, 0, 0, 0.15) 0%,
        rgba(0, 0, 0, 0.45) 45%,
        rgba(0, 0, 0, 0.75) 100%
      );
      z-index: 0; pointer-events: none;
    }

    /* ---------- APP ---------- */
    .app {
      width: 100%; max-width: 430px;
      height: 100dvh;
      max-height: 100dvh;
      background: transparent;
      position: relative; z-index: 5;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .screen {
      flex: 1;
      overflow-y: auto; overflow-x: hidden;
      padding: 14px 12px 6px;
      scrollbar-width: none; -ms-overflow-style: none;
      display: flex; flex-direction: column; gap: 8px;
      min-height: 0;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* ---------- TOP HEADER ---------- */
    .top-header {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 8px; align-items: center;
      flex-shrink: 0;
    }

    .user-box {
      background: rgba(0, 15, 25, 0.65);
      border: 1.5px solid rgba(0, 255, 255, 0.6);
      border-radius: 50%;
      width: 42px; height: 42px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.4), inset 0 0 12px rgba(0, 255, 255, 0.1);
      margin: 0 auto;
      backdrop-filter: blur(6px);
    }
    .user-box .u-icon {
      font-size: 20px;
      filter: drop-shadow(0 0 8px rgba(0, 200, 255, 0.9));
    }

    .brand-box { text-align: center; }
    .brand-box .crown {
      font-size: 12px;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 1));
      margin-bottom: -2px;
    }
    .brand-box .brand-name {
      font-size: 17px; font-weight: 900; letter-spacing: 1.5px;
      background: linear-gradient(180deg, #fff5cc, #ffd700, #b8860b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 1)) drop-shadow(0 2px 3px rgba(0,0,0,1));
      line-height: 1;
    }

    .wallet-box {
      background: rgba(0, 15, 25, 0.65);
      border: 1.5px solid rgba(0, 255, 255, 0.6);
      border-radius: 12px;
      padding: 5px 7px;
      display: flex; align-items: center; justify-content: center; gap: 5px;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.4), inset 0 0 12px rgba(0, 255, 255, 0.1);
      backdrop-filter: blur(6px);
    }
    .wallet-box .w-icon {
      font-size: 13px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.9));
    }
    .wallet-box .w-status {
      font-size: 8px; color: #00ff88; font-weight: 900;
      text-shadow: 0 0 8px rgba(0, 255, 136, 1);
      display: flex; align-items: center; gap: 3px;
      white-space: nowrap;
    }
    .wallet-box .w-dot {
      width: 5px; height: 5px; border-radius: 50%;
      background: #00ff88; box-shadow: 0 0 8px #00ff88;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* ---------- LEVEL BADGE ---------- */
    .level-card {
      background: rgba(0, 15, 25, 0.6);
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      border-radius: 14px;
      padding: 8px 12px;
      display: flex; align-items: center; justify-content: space-between;
      box-shadow: 0 0 22px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.05);
      position: relative; overflow: hidden;
      flex-shrink: 0;
      backdrop-filter: blur(8px);
    }
    .level-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
    }
    .level-left { display: flex; align-items: center; gap: 10px; }
    .level-circle {
      width: 38px; height: 38px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff5cc, #ffd700 60%, #b8860b);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 16px; color: #3d2e00;
      box-shadow: 
        0 0 18px rgba(255, 215, 0, 0.8),
        0 0 0 2px rgba(255, 215, 0, 0.5),
        inset 0 2px 0 rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }
    .level-text { display: flex; flex-direction: column; gap: 1px; }
    .level-text .lv-label {
      font-size: 9px; color: #00ffff; font-weight: 900;
      letter-spacing: 1.2px;
      text-shadow: 0 0 10px rgba(0, 255, 255, 1);
    }
    .level-text .lv-name {
      font-size: 14px; font-weight: 900; color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 2px 4px rgba(0, 0, 0, 1);
    }
    .level-trophy {
      font-size: 18px;
      filter: drop-shadow(0 0 10px rgba(255, 215, 0, 1));
    }

    /* ---------- MINING BALANCE ---------- */
    .mining-card {
      background: rgba(0, 15, 25, 0.6);
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      border-radius: 14px;
      padding: 8px 12px;
      text-align: center;
      box-shadow: 0 0 22px rgba(0, 255, 255, 0.2), inset 0 0 15px rgba(0, 255, 255, 0.05);
      position: relative; overflow: hidden;
      flex-shrink: 0;
      backdrop-filter: blur(8px);
    }
    .mining-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
    }
    .mining-card .mc-label {
      font-size: 10px; color: #ffd700; font-weight: 900;
      letter-spacing: 1.8px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 1);
      margin-bottom: 2px;
    }
    .mining-card .mc-value {
      font-size: 22px; font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.9), 0 0 40px rgba(255, 215, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 1);
      letter-spacing: 1px;
      line-height: 1.1;
    }
    .mining-card .mc-value span {
      color: #ffd700;
      font-size: 16px;
    }

    /* ============================================================
       LOGO SPACER — BDC লোগো দেখার জন্য ফাঁকা জায়গা
       (এখানে কোনো কার্ড বসবে না, শুধু ব্যাকগ্রাউন্ড ইমেজের লোগো দেখা যাবে)
       ============================================================ */
    .logo-spacer {
      flex: 1 1 auto;
      min-height: 140px;
      position: relative;
      pointer-events: none;
    }

    /* ---------- SPEED ROW ---------- */
    .speed-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }
    .speed-card {
      background: rgba(0, 15, 25, 0.6);
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      border-radius: 12px;
      padding: 8px 10px;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.15), inset 0 0 15px rgba(0, 255, 255, 0.05);
      position: relative; overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .speed-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
    }
    .speed-card .sc-head {
      display: flex; align-items: center; gap: 4px;
      font-size: 9px; color: #ffd700; font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 1);
      margin-bottom: 2px;
    }
    .speed-card .sc-head .sc-icon {
      font-size: 12px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 1));
    }
    .speed-card .sc-value {
      font-size: 17px; font-weight: 900; color: #ffffff;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.8), 0 2px 4px rgba(0, 0, 0, 1);
      line-height: 1.1;
    }
    .speed-card .sc-value span {
      color: #ffd700;
      font-size: 12px;
    }
    .speed-card .sc-sub {
      font-size: 9px; color: #00ffff; font-weight: 700;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.9);
      margin-top: 1px;
    }

    /* ---------- REFERRAL MINI ROW ---------- */
    .ref-mini-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
    }
    .ref-mini {
      background: rgba(0, 15, 25, 0.6);
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      border-radius: 12px;
      padding: 7px 5px;
      text-align: center;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.15), inset 0 0 15px rgba(0, 255, 255, 0.05);
      position: relative; overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .ref-mini::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
    }
    .ref-mini .rm-icon {
      font-size: 14px;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.9));
      margin-bottom: 1px;
    }
    .ref-mini .rm-value {
      font-size: 15px; font-weight: 900; color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 2px 4px rgba(0, 0, 0, 1);
      line-height: 1.1;
    }
    .ref-mini .rm-label {
      font-size: 8px; color: #00ffff; font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
      margin-top: 1px;
    }

    /* ---------- NEXT LEVEL PROGRESS ---------- */
    .next-level-card {
      background: rgba(0, 15, 25, 0.6);
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      border-radius: 12px;
      padding: 8px 12px;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.15), inset 0 0 15px rgba(0, 255, 255, 0.05);
      position: relative; overflow: hidden;
      flex-shrink: 0;
      backdrop-filter: blur(8px);
    }
    .next-level-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
    }
    .nl-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 5px;
    }
    .nl-left {
      display: flex; align-items: center; gap: 5px;
    }
    .nl-left .nl-icon {
      font-size: 15px;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.9));
    }
    .nl-left .nl-text {
      font-size: 11px; color: #ffffff; font-weight: 800;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    }
    .nl-right {
      font-size: 11px; color: #ffd700; font-weight: 900;
      text-shadow: 0 0 10px rgba(255, 215, 0, 1);
    }
    .nl-bar {
      width: 100%; height: 7px;
      background: rgba(0, 255, 255, 0.15);
      border-radius: 40px; overflow: hidden;
      border: 1px solid rgba(0, 255, 255, 0.3);
      position: relative;
    }
    .nl-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffaa00);
      border-radius: 40px;
      box-shadow: 0 0 12px rgba(255, 215, 0, 1);
      transition: width 0.5s ease;
      position: relative;
    }
    .nl-bar-fill::after {
      content: '';
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
      animation: shine 2s infinite;
    }
    @keyframes shine {
      0% { left: -100%; }
      100% { left: 200%; }
    }
    .nl-reward {
      font-size: 9px; color: #00ffff; font-weight: 700;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.9);
      text-align: right;
      margin-top: 3px;
    }

    /* ---------- SOCIAL CODE ---------- */
    .social-card {
      background: rgba(0, 15, 25, 0.6);
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      border-radius: 12px;
      padding: 8px 10px;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.15), inset 0 0 15px rgba(0, 255, 255, 0.05);
      position: relative; overflow: hidden;
      flex-shrink: 0;
      backdrop-filter: blur(8px);
    }
    .social-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, #00ffff, transparent);
    }
    .social-card .sc-label {
      font-size: 10px; color: #ffd700; font-weight: 900;
      letter-spacing: 1.5px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 1);
      margin-bottom: 6px;
      display: flex; align-items: center; gap: 5px;
    }
    .social-card .sc-label .sc-icon {
      font-size: 12px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 1));
    }
    .social-row {
      display: flex; gap: 6px; align-items: center;
    }
    .social-input {
      flex: 1;
      padding: 9px 10px;
      border-radius: 40px;
      border: 1.5px solid rgba(0, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.55);
      font-size: 11px; outline: none;
      color: #ffffff; font-weight: 700;
      min-width: 0;
      text-align: center;
    }
    .social-input::placeholder { color: rgba(0, 255, 255, 0.5); }
    .social-input:focus {
      border-color: #00ffff;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.6);
    }
    .social-btn {
      padding: 9px 12px;
      border-radius: 40px;
      border: 1.5px solid #fff5cc;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000;
      font-weight: 900; font-size: 10px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 215, 0, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex; align-items: center; gap: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .social-btn:active { transform: scale(0.95); }

    .social-btn-paste {
      padding: 9px 12px;
      border-radius: 40px;
      border: 1.5px solid #00ffff;
      background: rgba(0, 255, 255, 0.12);
      color: #00ffff;
      font-weight: 900; font-size: 10px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.4);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex; align-items: center; gap: 3px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .social-btn-paste:active { transform: scale(0.95); }

    /* ---------- BOTTOM NAV ---------- */
    .bottom-nav {
      display: flex; gap: 8px;
      padding: 10px 12px 14px;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(10px);
      border-top: 1.5px solid rgba(0, 255, 255, 0.3);
      justify-content: space-around;
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      padding: 14px 6px;
      border-radius: 16px;
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      font-weight: 900; font-size: 11px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s ease;
      background: rgba(0, 15, 25, 0.75);
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
      letter-spacing: 0.8px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      box-shadow: 0 0 18px rgba(0, 255, 255, 0.2);
    }
    .nav-btn .nav-icon {
      font-size: 22px;
      filter: drop-shadow(0 0 8px rgba(0, 255, 255, 0.9));
    }
    .nav-btn.active {
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      border-color: #ffd700;
      color: #000;
      text-shadow: 0 1px 1px rgba(255,255,255,0.6);
      box-shadow: 0 0 28px rgba(255, 215, 0, 0.8);
    }
    .nav-btn.active .nav-icon {
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.8));
    }
    .nav-btn:active { transform: scale(0.95); }

    /* ---------- TASK / BOOSTER CARDS ---------- */
    .m-card {
      background: rgba(0, 15, 25, 0.65);
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 8px;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
      backdrop-filter: blur(8px);
    }
    .task-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px;
      background: rgba(0, 15, 25, 0.7);
      border-radius: 12px; border: 1px solid rgba(0, 255, 255, 0.4);
      margin-bottom: 8px;
      backdrop-filter: blur(8px);
    }
    .task-left { display: flex; align-items: center; gap: 10px; }
    .task-rank {
      width: 30px; height: 30px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
    }
    .task-info { display: flex; flex-direction: column; }
    .task-name {
      font-weight: 800; font-size: 12px; color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }
    .task-sub {
      font-size: 9px; color: #00ffff; font-weight: 700;
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.8);
    }
    .task-reward {
      font-weight: 900; font-size: 11px; color: #000;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      padding: 5px 10px; border-radius: 40px;
      border: 1px solid #fff5cc;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
      cursor: pointer;
    }
    .task-reward:active { transform: scale(0.95); }
    .task-reward:disabled { opacity: 0.5; }

    .booster-btn {
      padding: 9px 20px; border-radius: 40px;
      border: 1.5px solid #fff5cc;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000; font-weight: 900; font-size: 11px;
      text-transform: uppercase; letter-spacing: 1px;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      cursor: pointer;
    }
    .booster-btn:active { transform: scale(0.95); }

    .ref-link-box {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 40px; padding: 10px; margin: 8px 0;
      font-size: 11px; font-weight: 700; color: #ffffff;
      word-break: break-all;
      border: 1.5px solid rgba(0, 255, 255, 0.5);
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.5);
      text-align: center;
    }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000; padding: 10px 20px; border-radius: 40px;
      font-weight: 900; font-size: 12px;
      box-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 12px 30px rgba(0, 0, 0, 1);
      z-index: 200; animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
      pointer-events: none; white-space: nowrap;
      text-shadow: 0 1px 1px rgba(255,255,255,0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

    /* ---------- ছোট স্ক্রিনের জন্য অ্যাডজাস্টমেন্ট ---------- */
    @media (max-height: 700px) {
      .logo-spacer { min-height: 100px; }
      .mining-card .mc-value { font-size: 19px; }
      .nav-btn { padding: 11px 4px; }
      .nav-btn .nav-icon { font-size: 19px; }
    }
    @media (max-height: 600px) {
      .logo-spacer { min-height: 70px; }
      .coin-section { display: none; }
    }
  </style>
</head>
<body>

<div class="app" id="app">
  <div class="screen" id="screenContainer"></div>
  <div class="bottom-nav" id="bottomNav">
    <button class="nav-btn" id="navTasks" onclick="switchTab('tasks')">
      <span class="nav-icon">📋</span>TASKS
    </button>
    <button class="nav-btn active" id="navMining" onclick="switchTab('mining')">
      <span class="nav-icon">⛏️</span>MINING
    </button>
    <button class="nav-btn" id="navReferral" onclick="switchTab('referral')">
      <span class="nav-icon">👥</span>REFERRAL
    </button>
  </div>
</div>

<div id="toastContainer"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
const CONFIG = {
  baseRate: 0.0000000001,
  dailyCheckinReward: 8,
  checkinIntervalHours: 8,
  referralRewardSpeed: 10,
  socialCodeReward: 1,
  initialSpeed: 1,
  demoWallet: "DemoWallet...9XK2",
  demoUsername: "BDC Explorer",
  demoTelegramId: "tg_72839401",
};

// ============================================================
// STATE
// ============================================================
let state = {
  miningBalance: 0,
  mainBalance: 0,
  level: 1,
  totalSpeed: 1,
  baseSpeed: 1,
  referralCount: 0,
  totalReferralSpeed: 0,
  checkinSpeed: 0,
  lastCheckin: null,
  usedCodes: [],
  currentTab: 'mining',
  miningInterval: null,
};

// ============================================================
// LEVELS
// ============================================================
const LEVEL_NAMES = [
  "Bronze Dawn", "Golden Spark", "Auric Trail", "Copper Gleam", "Silver Ray",
  "Gold Whisper", "Amber Rise", "Pearl Light", "Opal Glow", "Topaz Shine",
  "Ruby Flame", "Sapphire Star", "Emerald Leaf", "Diamond Dust", "Platinum Pulse",
  "Titanium Will", "Celestial Gold", "Radiant Crest", "Luminous Path", "Noble Ember",
  "Royal Sparkle", "Imperial Glow", "Sovereign Light", "Majestic Gleam", "Regal Aura",
  "Gilded Horizon", "Golden Summit", "Auric Peak", "Crown Jewel", "Throne of Gold",
  "Scepter Shine", "Diadem Ray", "Orb of Fortune", "Chalice of Light", "Grail of Gold",
  "Phoenix Feather", "Dragon Scale", "Griffin Wing", "Unicorn Horn", "Pegasus Flight",
  "Star Forge", "Sun Smith", "Moon Weaver", "Comet Chaser", "Nebula Navigator",
  "Galaxy Guardian", "Cosmic Crown", "Astral Aura", "Stellar Spark", "Nova Glow",
  "Eclipse Shade", "Solstice Light", "Equinox Balance", "Zodiac Gold", "Orion's Belt",
  "Sirius Flame", "Vega Shine", "Polaris Star", "Andromeda Ray", "Milky Way",
  "Infinity Loop", "Eternity Ring", "Forever Gold", "Legacy Light", "Heritage Gleam",
  "Dynasty Gold", "Empire Ember", "Kingdom Crown", "Realm Radiance", "Domain of Gold",
  "Fortress Flame", "Citadel Shine", "Bastion Glow", "Rampart Ray", "Keep of Gold",
  "Vanguard Gold", "Sentinel Spark", "Guardian Gleam", "Defender Light", "Protector Gold",
  "Champion Flame", "Victor's Gold", "Conqueror's Crown", "Triumph Light", "Victory Ray",
  "Legend Gold", "Mythic Flame", "Epic Shine", "Saga Glow", "Chronicle Gold",
  "Eternal Flame", "Immortal Gold", "Everlasting Light", "Timeless Gleam", "Perpetual Gold",
  "Elite Sovereign"
];
while (LEVEL_NAMES.length < 100) LEVEL_NAMES.push("Level " + (LEVEL_NAMES.length + 1));

const LEVELS = LEVEL_NAMES.map((name, i) => ({
  level: i + 1, name: name,
  requiredBDC: (i + 1) * 100,
  reward: (i + 1) * 0.5,
}));

function getCurrentLevel(balance) {
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (balance >= LEVELS[i].requiredBDC) return LEVELS[i];
  }
  return LEVELS[0];
}
function getNextLevel(currentLevel) {
  const idx = LEVELS.findIndex(l => l.level === currentLevel.level);
  return idx < LEVELS.length - 1 ? LEVELS[idx + 1] : null;
}

// ============================================================
// STORAGE
// ============================================================
function saveState() {
  try {
    const toSave = { ...state };
    delete toSave.miningInterval;
    localStorage.setItem('bitdeen_state', JSON.stringify(toSave));
  } catch (e) { }
}
function loadState() {
  try {
    const saved = localStorage.getItem('bitdeen_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
      if (state.usedCodes === undefined) state.usedCodes = [];
    }
  } catch (e) { }
}

// ============================================================
// MINING ENGINE
// ============================================================
function startMining() {
  if (state.miningInterval) clearInterval(state.miningInterval);
  state.miningInterval = setInterval(() => {
    state.miningBalance += CONFIG.baseRate * state.totalSpeed;
    const curLv = getCurrentLevel(state.miningBalance);
    if (curLv.level !== state.level) {
      state.level = curLv.level;
      showToast(`⭐ Level Up! ${curLv.name}`);
    }
    updateLiveUI();
    if (Math.random() < 0.05) saveState();
  }, 1000);
}

function updateLiveUI() {
  const mb = document.getElementById('miningBalanceDisplay');
  const lv = document.getElementById('lvNum');
  const lvName = document.getElementById('lvName');
  const nlName = document.getElementById('nlName');
  const nlBDC = document.getElementById('nlBDC');
  const nlBar = document.getElementById('nlBarFill');
  const nlReward = document.getElementById('nlReward');

  if (mb) mb.textContent = state.miningBalance.toFixed(6);

  const curLv = getCurrentLevel(state.miningBalance);
  const nextLv = getNextLevel(curLv);

  if (lv) lv.textContent = curLv.level;
  if (lvName) lvName.textContent = curLv.name;
  if (nextLv) {
    if (nlName) nlName.textContent = "Next: " + nextLv.name;
    if (nlBDC) nlBDC.textContent = nextLv.requiredBDC + " BDC";
    const progress = Math.min(100, (state.miningBalance / nextLv.requiredBDC) * 100);
    if (nlBar) nlBar.style.width = progress + "%";
    if (nlReward) nlReward.textContent = "Reward: " + nextLv.reward + " BDC";
  }
}

// ============================================================
// ACTIONS
// ============================================================
function claimMining() {
  if (state.miningBalance <= 0) {
    showToast('⛏️ Nothing to claim yet!');
    return;
  }
  state.mainBalance += state.miningBalance;
  const claimed = state.miningBalance;
  state.miningBalance = 0;
  saveState();
  render();
  showToast(`⛏️ Claimed ${claimed.toFixed(6)} BDC!`);
}

function doCheckin() {
  if (state.lastCheckin) {
    const hoursSince = (Date.now() - new Date(state.lastCheckin).getTime()) / (1000 * 60 * 60);
    if (hoursSince < CONFIG.checkinIntervalHours) {
      showToast('⏳ Already checked in.');
      return;
    }
  }
  state.lastCheckin = new Date().toISOString();
  state.checkinSpeed += CONFIG.dailyCheckinReward;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed;
  saveState();
  render();
  showToast(`✅ Check-in! +${CONFIG.dailyCheckinReward} SPEED`);
}

function addReferral() {
  state.referralCount += 1;
  state.totalReferralSpeed = state.referralCount * CONFIG.referralRewardSpeed;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed;
  saveState();
  render();
  showToast(`+1 Referral! +${CONFIG.referralRewardSpeed} SPEED`);
}

async function pasteSocialCode() {
  const input = document.getElementById('socialCodeInput');
  if (!input) return;
  try {
    const text = await navigator.clipboard.readText();
    if (text && text.trim()) {
      input.value = text.trim().toUpperCase();
      showToast('📋 Code pasted!');
    } else {
      showToast('📋 Clipboard empty');
    }
  } catch (err) {
    const text = prompt('Paste your social code:');
    if (text && text.trim()) {
      input.value = text.trim().toUpperCase();
      showToast('📋 Code pasted!');
    }
  }
}

function claimSocialCode() {
  const input = document.getElementById('socialCodeInput');
  if (!input) return;
  const code = input.value.trim().toUpperCase();
  if (!code) { showToast('Please enter a code'); return; }
  if (state.usedCodes.includes(code)) { showToast('❌ Code already used'); return; }
  state.usedCodes.push(code);
  state.checkinSpeed += CONFIG.socialCodeReward;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed;
  saveState();
  input.value = '';
  render();
  showToast(`✅ Code claimed! +${CONFIG.socialCodeReward} SPEED`);
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const container = document.getElementById('screenContainer');
  if (state.currentTab === 'mining') container.innerHTML = getMiningHTML();
  else if (state.currentTab === 'tasks') container.innerHTML = getTasksHTML();
  else if (state.currentTab === 'referral') container.innerHTML = getReferralHTML();
  updateLiveUI();
}

function getMiningHTML() {
  const curLv = getCurrentLevel(state.miningBalance);
  const nextLv = getNextLevel(curLv);
  const progress = nextLv ? Math.min(100, (state.miningBalance / nextLv.requiredBDC) * 100) : 100;

  return `
    <!-- TOP HEADER -->
    <div class="top-header">
      <div class="user-box"><span class="u-icon">👤</span></div>
      <div class="brand-box">
        <div class="crown">👑</div>
        <div class="brand-name">BITDEEN</div>
      </div>
      <div class="wallet-box">
        <span class="w-icon">💼</span>
        <span class="w-status"><span class="w-dot"></span>CONNECTED</span>
      </div>
    </div>

    <!-- LEVEL BADGE -->
    <div class="level-card">
      <div class="level-left">
        <div class="level-circle" id="lvNum">${curLv.level}</div>
        <div class="level-text">
          <span class="lv-label">LEVEL ${String(curLv.level).padStart(2, '0')}</span>
          <span class="lv-name" id="lvName">${curLv.name}</span>
        </div>
      </div>
      <div class="level-trophy">🏆</div>
    </div>

    <!-- MINING BALANCE -->
    <div class="mining-card">
      <div class="mc-label">MINING BALANCE</div>
      <div class="mc-value" id="miningBalanceDisplay">${state.miningBalance.toFixed(6)} <span>BDC</span></div>
    </div>

    <!-- ============================================================
         LOGO SPACER — এই জায়গায় ব্যাকগ্রাউন্ড ইমেজের BDC লোগো দেখা যাবে
         ============================================================ -->
    <div class="logo-spacer"></div>

    <!-- SPEED ROW -->
    <div class="speed-row">
      <div class="speed-card">
        <div class="sc-head"><span class="sc-icon">⚡</span>TOTAL SPEED</div>
        <div class="sc-value">${state.totalSpeed} <span>SPEED</span></div>
        <div class="sc-sub">Base ${state.baseSpeed} + Referral ${state.totalReferralSpeed}</div>
      </div>
      <div class="speed-card">
        <div class="sc-head"><span class="sc-icon">💰</span>MINING RATE</div>
        <div class="sc-value" style="font-size:14px;">${(CONFIG.baseRate * state.totalSpeed).toFixed(10)}</div>
        <div class="sc-sub">BDC / SEC</div>
      </div>
    </div>

    <!-- REFERRAL MINI ROW -->
    <div class="ref-mini-row">
      <div class="ref-mini">
        <div class="rm-icon">👤</div>
        <div class="rm-value">${state.referralCount}</div>
        <div class="rm-label">REFERRALS</div>
      </div>
      <div class="ref-mini">
        <div class="rm-icon">⚡</div>
        <div class="rm-value">+${state.totalReferralSpeed}</div>
        <div class="rm-label">REF SPEED</div>
      </div>
      <div class="ref-mini">
        <div class="rm-icon">👥</div>
        <div class="rm-value">—</div>
        <div class="rm-label">TEAM</div>
      </div>
    </div>

    <!-- NEXT LEVEL PROGRESS -->
    ${nextLv ? `
    <div class="next-level-card">
      <div class="nl-top">
        <div class="nl-left">
          <span class="nl-icon">🚀</span>
          <span class="nl-text" id="nlName">Next: ${nextLv.name}</span>
        </div>
        <div class="nl-right" id="nlBDC">${nextLv.requiredBDC} BDC</div>
      </div>
      <div class="nl-bar">
        <div class="nl-bar-fill" id="nlBarFill" style="width:${progress}%"></div>
      </div>
      <div class="nl-reward" id="nlReward">Reward: ${nextLv.reward} BDC</div>
    </div>
    ` : ''}

    <!-- SOCIAL CODE -->
    <div class="social-card">
      <div class="sc-label"><span class="sc-icon">💻</span>PASTE SOCIAL CODE</div>
      <div class="social-row">
        <button class="social-btn-paste" onclick="pasteSocialCode()">📋 PASTE</button>
        <input class="social-input" id="socialCodeInput" placeholder="Code" maxlength="20">
        <button class="social-btn" onclick="claimSocialCode()">⚡ CLAIM</button>
      </div>
    </div>
  `;
}

function getTasksHTML() {
  const canCheck = !state.lastCheckin || (Date.now() - new Date(state.lastCheckin).getTime()) / 3600000 >= CONFIG.checkinIntervalHours;
  const tasks = [
    { title: 'Telegram Task', desc: 'Join our channel', reward: '+2 SPEED' },
    { title: 'Social Task', desc: 'Share on X', reward: '+3 SPEED' },
    { title: 'Community Task', desc: 'Invite a friend', reward: '+5 SPEED' },
    { title: 'Admin Task', desc: 'Complete survey', reward: '+10 SPEED' },
  ];

  return `
    <div class="top-header">
      <div class="user-box"><span class="u-icon">👤</span></div>
      <div class="brand-box">
        <div class="crown">📋</div>
        <div class="brand-name">TASKS</div>
      </div>
      <div class="wallet-box">
        <span class="w-icon">💼</span>
        <span class="w-status"><span class="w-dot"></span>CONNECTED</span>
      </div>
    </div>

    <div class="m-card">
      <div class="task-item">
        <div class="task-left">
          <div class="task-rank">📅</div>
          <div class="task-info">
            <div class="task-name">Daily Check-in</div>
            <div class="task-sub">+${CONFIG.dailyCheckinReward} SPEED • Every ${CONFIG.checkinIntervalHours}h</div>
          </div>
        </div>
        <button class="task-reward" onclick="doCheckin()" ${!canCheck ? 'disabled' : ''}>${canCheck ? 'CLAIM' : 'WAIT'}</button>
      </div>
    </div>

    <div style="text-align:center;font-size:12px;font-weight:900;color:#00ffff;text-shadow:0 0 10px rgba(0,255,255,1);margin-top:6px;letter-spacing:2px;">OTHER TASKS</div>

    ${tasks.map(task => `
      <div class="task-item">
        <div class="task-left">
          <div class="task-rank">📌</div>
          <div class="task-info">
            <div class="task-name">${task.title}</div>
            <div class="task-sub">${task.desc}</div>
          </div>
        </div>
        <div class="task-reward">${task.reward}</div>
      </div>
    `).join('')}
  `;
}

function getReferralHTML() {
  return `
    <div class="top-header">
      <div class="user-box"><span class="u-icon">👤</span></div>
      <div class="brand-box">
        <div class="crown">👥</div>
        <div class="brand-name">REFERRAL</div>
      </div>
      <div class="wallet-box">
        <span class="w-icon">💼</span>
        <span class="w-status"><span class="w-dot"></span>CONNECTED</span>
      </div>
    </div>

    <div class="m-card" style="text-align:center;">
      <div style="font-size:11px;color:#00ffff;font-weight:900;text-shadow:0 0 10px rgba(0,255,255,1);letter-spacing:1px;">YOUR REFERRAL LINK</div>
      <div class="ref-link-box">t.me/BitdeenBot?start=ref_${CONFIG.demoTelegramId}</div>
      <button class="booster-btn" onclick="showToast('📋 Link copied!')">COPY LINK</button>
    </div>

    <div class="m-card">
      <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
        <span style="font-size:11px;font-weight:900;color:#00ffff;text-shadow:0 0 8px rgba(0,255,255,1);">TOTAL REFERRALS</span>
        <span style="font-weight:900;color:#ffffff;text-shadow:0 0 8px rgba(255,255,255,0.6);">${state.referralCount}</span>
      </div>
      <div style="display:flex;justify-content:space-between;margin-bottom:12px;">
        <span style="font-size:11px;font-weight:900;color:#00ffff;text-shadow:0 0 8px rgba(0,255,255,1);">REFERRAL SPEED</span>
        <span style="font-weight:900;color:#00ff88;text-shadow:0 0 10px rgba(0,255,136,1);">+${state.totalReferralSpeed} SPEED</span>
      </div>
      <button class="booster-btn" onclick="addReferral()" style="width:100%;">SIMULATE REFERRAL</button>
    </div>

    <div class="m-card" style="text-align:center;">
      <div style="font-size:11px;color:#00ffff;font-weight:900;text-shadow:0 0 8px rgba(0,255,255,1);margin-bottom:6px;">EARN +10 SPEED PER REFERRAL</div>
      <div style="font-size:10px;color:#c0c0c0;">Invite friends and earn together!</div>
    </div>
  `;
}

// ============================================================
// TABS
// ============================================================
function switchTab(tab) {
  state.currentTab = tab;
  saveState();
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  const map = { tasks: 'navTasks', mining: 'navMining', referral: 'navReferral' };
  const el = document.getElementById(map[tab]);
  if (el) el.classList.add('active');
  render();
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3000);
}

// ============================================================
// INIT
// ============================================================
function init() {
  loadState();
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed;
  startMining();
  render();
  setInterval(saveState, 5000);
}

init();

window.switchTab = switchTab;
window.claimMining = claimMining;
window.doCheckin = doCheckin;
window.addReferral = addReferral;
window.pasteSocialCode = pasteSocialCode;
window.claimSocialCode = claimSocialCode;
window.showToast = showToast;
</script>
</body>
</html>
