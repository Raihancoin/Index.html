<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>BITDEEN • BDC</title>
  <style>
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    /* ============================================================
       BACKGROUND IMAGE
       ============================================================ */
    body {
      background-image: url('bg-gold.jpg');   /* ← আপনার ইমেজের নাম */
      background-size: cover;
      background-position: center top;
      background-attachment: fixed;
      background-color: #000;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    /* হালকা ভিনিয়েট — শুধু চারপাশে অন্ধকার, মাঝখানে লোগো ক্লিয়ার */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(
        ellipse 80% 60% at 50% 42%,
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 0.15) 55%,
        rgba(0, 0, 0, 0.65) 100%
      );
      z-index: 0; pointer-events: none;
    }

    /* ---------- APP ---------- */
    .app {
      width: 100%; max-width: 430px;
      height: 100dvh;
      max-height: 100dvh;
      background: transparent;
      position: relative; z-index: 5;
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .screen {
      flex: 1;
      overflow-y: auto; overflow-x: hidden;
      padding: 10px 10px 4px;
      scrollbar-width: none; -ms-overflow-style: none;
      display: flex; flex-direction: column; gap: 6px;
      min-height: 0;
    }
    .screen::-webkit-scrollbar { display: none; }

    /* ============================================================
       সব কার্ডের কমন স্টাইল — হালকা স্বচ্ছ
       ============================================================ */
    .glass {
      background: rgba(0, 12, 22, 0.35);
      border: 1.2px solid rgba(0, 255, 255, 0.45);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      box-shadow:
        0 0 14px rgba(0, 255, 255, 0.15),
        inset 0 0 20px rgba(0, 255, 255, 0.03);
      position: relative; overflow: hidden;
    }
    .glass::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,255,255,0.8), transparent);
    }

    /* ---------- TOP HEADER ---------- */
    .top-header {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 6px; align-items: center;
      flex-shrink: 0;
    }

    .user-box {
      background: rgba(0, 15, 25, 0.45);
      border: 1.2px solid rgba(0, 255, 255, 0.55);
      border-radius: 50%;
      width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.35), inset 0 0 10px rgba(0, 255, 255, 0.08);
      margin: 0 auto;
      backdrop-filter: blur(2px);
    }
    .user-box .u-icon {
      font-size: 18px;
      filter: drop-shadow(0 0 6px rgba(0, 200, 255, 0.9));
    }

    .brand-box { text-align: center; }
    .brand-box .crown {
      font-size: 11px;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 1));
      margin-bottom: -2px;
    }
    .brand-box .brand-name {
      font-size: 15px; font-weight: 900; letter-spacing: 1.4px;
      background: linear-gradient(180deg, #fff5cc, #ffd700, #b8860b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 1)) drop-shadow(0 2px 3px rgba(0,0,0,1));
      line-height: 1;
    }

    .wallet-box {
      background: rgba(0, 15, 25, 0.45);
      border: 1.2px solid rgba(0, 255, 255, 0.55);
      border-radius: 10px;
      padding: 4px 6px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.35), inset 0 0 10px rgba(0, 255, 255, 0.08);
      backdrop-filter: blur(2px);
    }
    .wallet-box .w-icon {
      font-size: 11px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.9));
    }
    .wallet-box .w-status {
      font-size: 7px; color: #00ff88; font-weight: 900;
      text-shadow: 0 0 8px rgba(0, 255, 136, 1);
      display: flex; align-items: center; gap: 3px;
      white-space: nowrap;
    }
    .wallet-box .w-dot {
      width: 4px; height: 4px; border-radius: 50%;
      background: #00ff88; box-shadow: 0 0 8px #00ff88;
      animation: pulseDot 2s infinite;
    }
    @keyframes pulseDot {
      0%,100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    /* ---------- LEVEL BADGE ---------- */
    .level-card {
      border-radius: 12px;
      padding: 6px 10px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .level-left { display: flex; align-items: center; gap: 8px; }
    .level-circle {
      width: 32px; height: 32px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff5cc, #ffd700 60%, #b8860b);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900; font-size: 14px; color: #3d2e00;
      box-shadow: 
        0 0 14px rgba(255, 215, 0, 0.8),
        0 0 0 2px rgba(255, 215, 0, 0.5),
        inset 0 2px 0 rgba(255, 255, 255, 0.6);
      flex-shrink: 0;
    }
    .level-text { display: flex; flex-direction: column; gap: 0px; }
    .level-text .lv-label {
      font-size: 8px; color: #00ffff; font-weight: 900;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
    }
    .level-text .lv-name {
      font-size: 12px; font-weight: 900; color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 1);
    }
    .level-trophy {
      font-size: 15px;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 1));
    }

    /* ---------- MINING BALANCE ---------- */
    .mining-card {
      border-radius: 12px;
      padding: 6px 10px;
      text-align: center;
      flex-shrink: 0;
    }
    .mining-card .mc-label {
      font-size: 9px; color: #ffd700; font-weight: 900;
      letter-spacing: 1.6px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 1);
      margin-bottom: 1px;
    }
    .mining-card .mc-value {
      font-size: 19px; font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 16px rgba(255, 215, 0, 0.9), 0 0 32px rgba(255, 215, 0, 0.5), 0 2px 4px rgba(0, 0, 0, 1);
      letter-spacing: 0.8px;
      line-height: 1.05;
    }
    .mining-card .mc-value span {
      color: #ffd700;
      font-size: 13px;
    }

    /* ============================================================
       LOGO SPACER — মাঝখানে ফাঁকা, যাতে BDC লোগো স্পষ্ট দেখা যায়
       ============================================================ */
    .logo-spacer {
      flex: 1 1 auto;
      min-height: 170px;
      position: relative;
      pointer-events: none;
    }

    /* ---------- SPEED ROW ---------- */
    .speed-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      flex-shrink: 0;
    }
    .speed-card {
      border-radius: 10px;
      padding: 6px 8px;
    }
    .speed-card .sc-head {
      display: flex; align-items: center; gap: 3px;
      font-size: 8px; color: #ffd700; font-weight: 900;
      letter-spacing: 0.8px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 1);
      margin-bottom: 1px;
    }
    .speed-card .sc-head .sc-icon {
      font-size: 10px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 1));
    }
    .speed-card .sc-value {
      font-size: 14px; font-weight: 900; color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 1);
      line-height: 1.05;
    }
    .speed-card .sc-value span {
      color: #ffd700;
      font-size: 10px;
    }
    .speed-card .sc-sub {
      font-size: 7.5px; color: #00ffff; font-weight: 700;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.9);
      margin-top: 1px;
    }

    /* ---------- REFERRAL MINI ROW ---------- */
    .ref-mini-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      flex-shrink: 0;
    }
    .ref-mini {
      border-radius: 10px;
      padding: 5px 4px;
      text-align: center;
    }
    .ref-mini .rm-icon {
      font-size: 11px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.9));
      margin-bottom: 0px;
    }
    .ref-mini .rm-value {
      font-size: 13px; font-weight: 900; color: #ffffff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 2px 4px rgba(0, 0, 0, 1);
      line-height: 1.05;
    }
    .ref-mini .rm-label {
      font-size: 7px; color: #00ffff; font-weight: 900;
      letter-spacing: 0.8px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
      margin-top: 0px;
    }

    /* ---------- NEXT LEVEL PROGRESS ---------- */
    .next-level-card {
      border-radius: 10px;
      padding: 6px 10px;
      flex-shrink: 0;
    }
    .nl-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 4px;
    }
    .nl-left {
      display: flex; align-items: center; gap: 4px;
    }
    .nl-left .nl-icon {
      font-size: 12px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.9));
    }
    .nl-left .nl-text {
      font-size: 9.5px; color: #ffffff; font-weight: 800;
      text-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
    }
    .nl-right {
      font-size: 9.5px; color: #ffd700; font-weight: 900;
      text-shadow: 0 0 10px rgba(255, 215, 0, 1);
    }
    .nl-bar {
      width: 100%; height: 6px;
      background: rgba(0, 255, 255, 0.12);
      border-radius: 40px; overflow: hidden;
      border: 1px solid rgba(0, 255, 255, 0.3);
      position: relative;
    }
    .nl-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #ffd700, #ffaa00);
      border-radius: 40px;
      box-shadow: 0 0 10px rgba(255, 215, 0, 1);
      transition: width 0.5s ease;
      position: relative;
    }
    .nl-bar-fill::after {
      content: '';
      position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
      animation: shine 2s infinite;
    }
    @keyframes shine {
      0% { left: -100%; }
      100% { left: 200%; }
    }
    .nl-reward {
      font-size: 8px; color: #00ffff; font-weight: 700;
      text-shadow: 0 0 8px rgba(0, 255, 255, 0.9);
      text-align: right;
      margin-top: 2px;
    }

    /* ---------- SOCIAL CODE ---------- */
    .social-card {
      border-radius: 10px;
      padding: 6px 8px;
      flex-shrink: 0;
    }
    .social-card .sc-label {
      font-size: 9px; color: #ffd700; font-weight: 900;
      letter-spacing: 1.3px;
      text-shadow: 0 0 8px rgba(255, 215, 0, 1);
      margin-bottom: 4px;
      display: flex; align-items: center; gap: 4px;
    }
    .social-card .sc-label .sc-icon {
      font-size: 10px;
      filter: drop-shadow(0 0 6px rgba(255, 215, 0, 1));
    }
    .social-row {
      display: flex; gap: 5px; align-items: center;
    }
    .social-input {
      flex: 1;
      padding: 7px 8px;
      border-radius: 40px;
      border: 1.2px solid rgba(0, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.4);
      font-size: 10px; outline: none;
      color: #ffffff; font-weight: 700;
      min-width: 0;
      text-align: center;
    }
    .social-input::placeholder { color: rgba(0, 255, 255, 0.55); }
    .social-input:focus {
      border-color: #00ffff;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.6);
    }
    .social-btn {
      padding: 7px 10px;
      border-radius: 40px;
      border: 1.2px solid #fff5cc;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000;
      font-weight: 900; font-size: 9px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(255, 215, 0, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex; align-items: center; gap: 3px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .social-btn:active { transform: scale(0.95); }

    .social-btn-paste {
      padding: 7px 10px;
      border-radius: 40px;
      border: 1.2px solid #00ffff;
      background: rgba(0, 255, 255, 0.1);
      color: #00ffff;
      font-weight: 900; font-size: 9px;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.35);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      display: flex; align-items: center; gap: 3px;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .social-btn-paste:active { transform: scale(0.95); }

    /* ---------- BOTTOM NAV ---------- */
    .bottom-nav {
      display: flex; gap: 6px;
      padding: 8px 10px 12px;
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(8px);
      border-top: 1.2px solid rgba(0, 255, 255, 0.3);
      justify-content: space-around;
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      padding: 10px 4px;
      border-radius: 12px;
      border: 1.2px solid rgba(0, 255, 255, 0.5);
      font-weight: 900; font-size: 10px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s ease;
      background: rgba(0, 15, 25, 0.7);
      color: #00ffff;
      text-shadow: 0 0 8px rgba(0, 255, 255, 1);
      letter-spacing: 0.6px;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      box-shadow: 0 0 14px rgba(0, 255, 255, 0.2);
    }
    .nav-btn .nav-icon {
      font-size: 18px;
      filter: drop-shadow(0 0 6px rgba(0, 255, 255, 0.9));
    }
    .nav-btn.active {
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      border-color: #ffd700;
      color: #000;
      text-shadow: 0 1px 1px rgba(255,255,255,0.6);
      box-shadow: 0 0 22px rgba(255, 215, 0, 0.8);
    }
    .nav-btn.active .nav-icon {
      filter: drop-shadow(0 0 6px rgba(0, 0, 0, 0.8));
    }
    .nav-btn:active { transform: scale(0.95); }

    /* ---------- TASK CARDS ---------- */
    .m-card {
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 6px;
    }
    .task-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px;
      background: rgba(0, 12, 22, 0.4);
      border-radius: 10px;
      border: 1.2px solid rgba(0, 255, 255, 0.4);
      margin-bottom: 6px;
      backdrop-filter: blur(2px);
    }
    .task-left { display: flex; align-items: center; gap: 8px; }
    .task-rank {
      width: 26px; height: 26px; border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #ffd700, #b8860b);
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; flex-shrink: 0;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }
    .task-info { display: flex; flex-direction: column; }
    .task-name {
      font-weight: 800; font-size: 11px; color: #ffffff;
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.5);
    }
    .task-sub {
      font-size: 8px; color: #00ffff; font-weight: 700;
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.8);
    }
    .task-reward {
      font-weight: 900; font-size: 10px; color: #000;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      padding: 4px 9px; border-radius: 40px;
      border: 1px solid #fff5cc;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
      cursor: pointer;
    }
    .task-reward:active { transform: scale(0.95); }
    .task-reward:disabled { opacity: 0.5; }

    .booster-btn {
      padding: 8px 16px; border-radius: 40px;
      border: 1.2px solid #fff5cc;
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000; font-weight: 900; font-size: 10px;
      text-transform: uppercase; letter-spacing: 0.8px;
      box-shadow: 0 0 16px rgba(255, 215, 0, 0.6);
      cursor: pointer;
    }
    .booster-btn:active { transform: scale(0.95); }

    .ref-link-box {
      background: rgba(0, 0, 0, 0.55);
      border-radius: 40px; padding: 8px; margin: 6px 0;
      font-size: 10px; font-weight: 700; color: #ffffff;
      word-break: break-all;
      border: 1.2px solid rgba(0, 255, 255, 0.5);
      text-shadow: 0 0 6px rgba(0, 255, 255, 0.5);
      text-align: center;
    }

    /* ---------- TOAST ---------- */
    .toast {
      position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(180deg, #ffe680, #ffd700, #b8860b);
      color: #000; padding: 9px 18px; border-radius: 40px;
      font-weight: 900; font-size: 11px;
      box-shadow: 0 0 36px rgba(255, 215, 0, 1), 0 12px 30px rgba(0, 0, 0, 1);
      z-index: 200; animation: toastIn 0.4s ease, toastOut 0.4s ease 2.6s forwards;
      pointer-events: none; white-space: nowrap;
      text-shadow: 0 1px 1px rgba(255,255,255,0.6);
      border: 1.2px solid rgba(255, 255, 255, 0.6);
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }

    /* ---------- ছোট স্ক্রিন ---------- */
    @media (max-height: 720px) {
      .logo-spacer { min-height: 130px; }
    }
    @media (max-height: 640px) {
      .logo-spacer { min-height: 90px; }
    }
  </style>
</head>

  "Elite Sovereign"
];
while (LEVEL_NAMES.length < 100) LEVEL_NAMES.push("Level " + (LEVEL_NAMES.length + 1));

const LEVELS = LEVEL_NAMES.map((name, i) => ({
  level: i + 1, name: name,
  requiredBDC: (i + 1) * 100,
  reward: (i + 1) * 0.5,
}));

function getCurrentLevel(balance) {
  for (let i = LEVELS.length - 1; i >= 0; i--) {
    if (balance >= LEVELS[i].requiredBDC) return LEVELS[i];
  }
  return LEVELS[0];
}
function getNextLevel(currentLevel) {
  const idx = LEVELS.findIndex(l => l.level === currentLevel.level);
  return idx < LEVELS.length - 1 ? LEVELS[idx + 1] : null;
}

// ============================================================
// STORAGE
// ============================================================
function saveState() {
  try {
    const toSave = { ...state };
    delete toSave.miningInterval;
    localStorage.setItem('bitdeen_state', JSON.stringify(toSave));
  } catch (e) { }
}
function loadState() {
  try {
    const saved = localStorage.getItem('bitdeen_state');
    if (saved) {
      const parsed = JSON.parse(saved);
      Object.assign(state, parsed);
      if (state.usedCodes === undefined) state.usedCodes = [];
    }
  } catch (e) { }
}

// ============================================================
// MINING ENGINE
// ============================================================
function startMining() {
  if (state.miningInterval) clearInterval(state.miningInterval);
  state.miningInterval = setInterval(() => {
    state.miningBalance += CONFIG.baseRate * state.totalSpeed;
    const curLv = getCurrentLevel(state.miningBalance);
    if (curLv.level !== state.level) {
      state.level = curLv.level;
      showToast(`⭐ Level Up! ${curLv.name}`);
    }
    updateLiveUI();
    if (Math.random() < 0.05) saveState();
  }, 1000);
}

function updateLiveUI() {
  const mb = document.getElementById('miningBalanceDisplay');
  const lv = document.getElementById('lvNum');
  const lvName = document.getElementById('lvName');
  const nlName = document.getElementById('nlName');
  const nlBDC = document.getElementById('nlBDC');
  const nlBar = document.getElementById('nlBarFill');
  const nlReward = document.getElementById('nlReward');

  if (mb) mb.textContent = state.miningBalance.toFixed(6);

  const curLv = getCurrentLevel(state.miningBalance);
  const nextLv = getNextLevel(curLv);

  if (lv) lv.textContent = curLv.level;
  if (lvName) lvName.textContent = curLv.name;
  if (nextLv) {
    if (nlName) nlName.textContent = "Next: " + nextLv.name;
    if (nlBDC) nlBDC.textContent = nextLv.requiredBDC + " BDC";
    const progress = Math.min(100, (state.miningBalance / nextLv.requiredBDC) * 100);
    if (nlBar) nlBar.style.width = progress + "%";
    if (nlReward) nlReward.textContent = "Reward: " + nextLv.reward + " BDC";
  }
}

// ============================================================
// ACTIONS
// ============================================================
function claimMining() {
  if (state.miningBalance <= 0) {
    showToast('⛏️ Nothing to claim yet!');
    return;
  }
  state.mainBalance += state.miningBalance;
  const claimed = state.miningBalance;
  state.miningBalance = 0;
  saveState();
  render();
  showToast(`⛏️ Claimed ${claimed.toFixed(6)} BDC!`);
}

function doCheckin() {
  if (state.lastCheckin) {
    const hoursSince = (Date.now() - new Date(state.lastCheckin).getTime()) / (1000 * 60 * 60);
    if (hoursSince < CONFIG.checkinIntervalHours) {
      showToast('⏳ Already checked in.');
      return;
    }
  }
  state.lastCheckin = new Date().toISOString();
  state.checkinSpeed += CONFIG.dailyCheckinReward;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed;
  saveState();
  render();
  showToast(`✅ Check-in! +${CONFIG.dailyCheckinReward} SPEED`);
}

function addReferral() {
  state.referralCount += 1;
  state.totalReferralSpeed = state.referralCount * CONFIG.referralRewardSpeed;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed;
  saveState();
  render();
  showToast(`+1 Referral! +${CONFIG.referralRewardSpeed} SPEED`);
}

async function pasteSocialCode() {
  const input = document.getElementById('socialCodeInput');
  if (!input) return;
  try {
    const text = await navigator.clipboard.readText();
    if (text && text.trim()) {
      input.value = text.trim().toUpperCase();
      showToast('📋 Code pasted!');
    } else {
      showToast('📋 Clipboard empty');
    }
  } catch (err) {
    const text = prompt('Paste your social code:');
    if (text && text.trim()) {
      input.value = text.trim().toUpperCase();
      showToast('📋 Code pasted!');
    }
  }
}

function claimSocialCode() {
  const input = document.getElementById('socialCodeInput');
  if (!input) return;
  const code = input.value.trim().toUpperCase();
  if (!code) { showToast('Please enter a code'); return; }
  if (state.usedCodes.includes(code)) { showToast('❌ Code already used'); return; }
  state.usedCodes.push(code);
  state.checkinSpeed += CONFIG.socialCodeReward;
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed;
  saveState();
  input.value = '';
  render();
  showToast(`✅ Code claimed! +${CONFIG.socialCodeReward} SPEED`);
}

// ============================================================
// RENDER
// ============================================================
function render() {
  const container = document.getElementById('screenContainer');
  if (state.currentTab === 'mining') container.innerHTML = getMiningHTML();
  else if (state.currentTab === 'tasks') container.innerHTML = getTasksHTML();
  else if (state.currentTab === 'referral') container.innerHTML = getReferralHTML();
  updateLiveUI();
}

      </div>
    </div>

    <!-- NEXT LEVEL PROGRESS -->
    ${nextLv ? `

          <span class="nl-icon">🚀</span>

        </div>
        <div class="nl-right" id="nlBDC">${nextLv.requiredBDC} BDC</div>
      </div>
      <div class="nl-bar">
        <div class="nl-bar-fill" id="nlBarFill" style="width:${progress}%"></div>
      </div>
      <div class="nl-reward" id="nlReward">Reward: ${nextLv.reward} BDC</div>
    </div>
    ` : ''}

    <!-- SOCIAL CODE -->
    <div class="social-card glass">
      <div class="sc-label"><span class="sc-icon">💻</span>PASTE SOCIAL CODE</div>
      <div class="social-row">
        <button class="social-btn-paste" onclick="pasteSocialCode()">📋 PASTE</button>
        <input class="social-input" id="socialCodeInput" placeholder="Code" maxlength="20">
        <button class="social-btn" onclick="claimSocialCode()">⚡ CLAIM</button>

}

// ============================================================
// TABS
// ============================================================
function switchTab(tab) {
  state.currentTab = tab;
  saveState();
  document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
  const map = { tasks: 'navTasks', mining: 'navMining', referral: 'navReferral' };
  const el = document.getElementById(map[tab]);
  if (el) el.classList.add('active');
  render();
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3000);
}

// ============================================================
// INIT
// ============================================================
function init() {
  loadState();
  state.totalSpeed = state.baseSpeed + state.totalReferralSpeed + state.checkinSpeed;
  startMining();
  render();
  setInterval(saveState, 5000);
}

init();

window.switchTab = switchTab;
window.claimMining = claimMining;
window.doCheckin = doCheckin;
window.addReferral = addReferral;
window.pasteSocialCode = pasteSocialCode;
window.claimSocialCode = claimSocialCode;
window.showToast = showToast;
</script>
