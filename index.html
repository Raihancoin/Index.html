<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BITDEEN Mining App</title>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-primary: #ffcc00;
            --gold-dark: #cc9900;
            --gold-light: #ffe680;
            --cyan-primary: #00e5ff;
            --cyan-dark: #0088cc;
            --bg-dark: #050a10;
            --panel-bg: rgba(10, 20, 30, 0.85);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Container to look like a mobile screen */
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 850px;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 15px 12px;
            /* 
             * এখানে আপনার ব্যাকগ্রাউন্ড ইমেজের নাম বসাবেন। 
             * যেমন: background-image: url('your-background-image.jpg');
             */
            background-image: url('your-background-image.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
            overflow-y: auto;
            overflow-x: hidden;
            z-index: 1;
        }

        /* Optional overlay if bg image is too bright */
        .app-container::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); /* Adjust opacity as needed */
            z-index: -1;
            border-radius: 20px;
        }

        /* --- Header --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            position: relative;
        }

        .profile-icon {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--gold-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 10px var(--gold-primary);
        }

        .profile-icon i {
            font-size: 24px;
            color: var(--cyan-primary);
        }

        .logo-area {
            text-align: center;
            flex-grow: 1;
        }

        .logo-area .crown {
            color: var(--gold-primary);
            font-size: 18px;
            display: block;
            margin-bottom: -5px;
            text-shadow: 0 0 10px var(--gold-primary);
        }

        .logo-area h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: var(--gold-primary);
            text-shadow: 0 2px 5px rgba(0,0,0,0.8), 0 0 10px var(--gold-dark);
            letter-spacing: 2px;
            margin: 0;
        }

        .wallet-status {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 10px;
            border-radius: 20px;
            border: 1px solid var(--gold-dark);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.3);
        }

        .wallet-status i {
            color: var(--gold-primary);
            font-size: 14px;
        }

        .wallet-status span {
            font-size: 10px;
            font-weight: 700;
            color: #fff;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background: #00ff00;
            border-radius: 50%;
            box-shadow: 0 0 5px #00ff00;
        }

        /* --- Level Section --- */
        .level-section {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--panel-bg);
            border: 1px solid var(--cyan-primary);
            border-radius: 12px;
            padding: 10px 15px;
            margin-bottom: 15px;
            box-shadow: inset 0 0 15px rgba(0, 229, 255, 0.2), 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .level-badge {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 18px;
            color: #000;
            box-shadow: 0 0 10px var(--gold-primary);
        }

        .level-info {
            flex-grow: 1;
            margin-left: 15px;
        }

        .level-info .level-text {
            font-size: 10px;
            color: var(--cyan-primary);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .level-info h2 {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }

        .trophy-icon {
            color: var(--gold-primary);
            font-size: 20px;
            text-shadow: 0 0 10px var(--gold-primary);
        }

        /* --- Mining Balance --- */
        .balance-section {
            text-align: center;
            background: var(--panel-bg);
            border: 1px solid var(--gold-primary);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 20px;
            box-shadow: inset 0 0 15px rgba(255, 204, 0, 0.2), 0 0 15px rgba(255, 204, 0, 0.3);
        }

        .balance-section .balance-label {
            font-size: 12px;
            color: var(--gold-primary);
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .balance-section .balance-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--gold-primary), 0 0 20px var(--gold-dark);
        }

        /* --- Main Mining Circle --- */
        .mining-circle-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
            position: relative;
        }

        .mining-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,204,0,0.2) 0%, rgba(0,0,0,0.8) 70%);
            border: 3px solid var(--gold-primary);
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px var(--gold-primary), inset 0 0 30px var(--gold-dark);
            position: relative;
        }

        /* Rotating outer rings for effect */
        .mining-circle::before, .mining-circle::after {
            content: '';
            position: absolute;
            border-radius: 50%;
            border: 2px dashed var(--gold-primary);
            animation: rotate 20s linear infinite;
        }

        .mining-circle::before {
            width: 220px;
            height: 220px;
            border-color: rgba(255, 204, 0, 0.5);
            animation-direction: reverse;
        }

        .mining-circle::after {
            width: 240px;
            height: 240px;
            border-color: rgba(0, 229, 255, 0.3);
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .mining-circle .bdc-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 40px;
            font-weight: 900;
            color: var(--gold-primary);
            text-shadow: 0 0 15px var(--gold-primary), 0 0 30px var(--gold-dark);
            z-index: 2;
        }

        .mining-circle .crown-top, .mining-circle .crown-bottom {
            position: absolute;
            color: var(--gold-primary);
            font-size: 20px;
            z-index: 2;
        }
        .mining-circle .crown-top { top: 30px; }
        .mining-circle .crown-bottom { bottom: 30px; }

        /* --- Stats Grid --- */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: var(--panel-bg);
            border: 1px solid var(--cyan-primary);
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            box-shadow: inset 0 0 10px rgba(0, 229, 255, 0.1), 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .stat-box .stat-label {
            font-size: 10px;
            color: var(--cyan-primary);
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin-bottom: 5px;
        }

        .stat-box .stat-label i {
            color: var(--gold-primary);
        }

        .stat-box .stat-value {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .stat-box .stat-sub {
            font-size: 10px;
            color: #aaa;
            margin-top: 2px;
        }

        .stats-row-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stats-row-3 .stat-box {
            padding: 8px 5px;
        }

        .stats-row-3 .stat-box .stat-value {
            font-size: 16px;
        }
        
        .stats-row-3 .stat-box .stat-label {
            font-size: 9px;
        }

        /* --- Progress Bar --- */
        .progress-section {
            background: var(--panel-bg);
            border: 1px solid var(--gold-primary);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.2);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .progress-header .next-level {
            color: #fff;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .progress-header .next-level i {
            color: var(--gold-primary);
        }

        .progress-header .reward {
            color: var(--gold-primary);
            font-weight: 700;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 204, 0, 0.3);
        }

        .progress-bar-fill {
            width: 2%; /* Adjust based on progress */
            height: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-primary));
            border-radius: 10px;
            box-shadow: 0 0 10px var(--gold-primary);
        }
        
        .progress-footer {
            text-align: right;
            font-size: 10px;
            color: #aaa;
            margin-top: 5px;
        }

        /* --- Social Code Section --- */
        .social-section {
            background: var(--panel-bg);
            border: 1px solid var(--cyan-primary);
            border-radius: 10px;
            padding: 10px 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
        }

        .social-label {
            font-size: 11px;
            color: var(--cyan-primary);
            font-weight: 700;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .social-input-group {
            display: flex;
            gap: 10px;
        }

        .social-input-group input {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 229, 255, 0.5);
            border-radius: 8px;
            padding: 8px 12px;
            color: #fff;
            font-family: 'Rajdhani', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .social-input-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .social-input-group button {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border: none;
            border-radius: 8px;
            padding: 8px 20px;
            color: #000;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 0 10px var(--gold-primary);
            transition: transform 0.1s;
        }

        .social-input-group button:active {
            transform: scale(0.95);
        }

        /* --- Bottom Navigation --- */
        .bottom-nav {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-top: auto;
            padding-bottom: 10px;
        }

        .nav-btn {
            flex: 1;
            background: var(--panel-bg);
            border: 1px solid var(--cyan-primary);
            border-radius: 10px;
            padding: 12px 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            color: var(--cyan-primary);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.2);
            transition: all 0.3s;
        }

        .nav-btn i {
            font-size: 16px;
        }

        .nav-btn.active {
            background: linear-gradient(135deg, var(--gold-primary), var(--gold-dark));
            border-color: var(--gold-primary);
            color: #000;
            box-shadow: 0 0 15px var(--gold-primary);
        }

        .nav-btn.active i {
            color: #000;
        }

        /* Scrollbar styling */
        .app-container::-webkit-scrollbar {
            width: 4px;
        }
        .app-container::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Header -->
        <div class="header">
            <div class="profile-icon">
                <i class="fas fa-user"></i>
            </div>
            <div class="logo-area">
                <i class="fas fa-crown crown"></i>
                <h1>BITDEEN</h1>
            </div>
            <div class="wallet-status">
                <i class="fas fa-wallet"></i>
                <div class="status-dot"></div>
                <span>CONNECTED</span>
            </div>
        </div>

        <!-- Level Section -->
        <div class="level-section">
            <div class="level-badge">1</div>
            <div class="level-info">
                <div class="level-text">LEVEL 01</div>
                <h2>Bronze Dawn</h2>
            </div>
            <i class="fas fa-trophy trophy-icon"></i>
        </div>

        <!-- Balance Section -->
        <div class="balance-section">
            <div class="balance-label">MINING BALANCE</div>
            <div class="balance-amount">0.000000 BDC</div>
        </div>

        <!-- Main Mining Circle -->
        <div class="mining-circle-wrapper">
            <div class="mining-circle">
                <i class="fas fa-crown crown-top"></i>
                <div class="bdc-text">BDC</div>
                <i class="fas fa-crown crown-bottom"></i>
            </div>
        </div>

        <!-- Stats Grid (2 columns) -->
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label"><i class="fas fa-bolt"></i> TOTAL SPEED</div>
                <div class="stat-value">1 SPEED</div>
                <div class="stat-sub">Base 1 + Referral 0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label"><i class="fas fa-coins"></i> MINING RATE</div>
                <div class="stat-value">0.0000000001</div>
                <div class="stat-sub">BDC / SEC</div>
            </div>
        </div>

        <!-- Stats Row (3 columns) -->
        <div class="stats-row-3">
            <div class="stat-box">
                <div class="stat-label"><i class="fas fa-user"></i></div>
                <div class="stat-value">0</div>
                <div class="stat-label" style="color:#fff; margin-top:2px;">REFERRALS</div>
            </div>
            <div class="stat-box">
                <div class="stat-label"><i class="fas fa-tachometer-alt"></i></div>
                <div class="stat-value">+0</div>
                <div class="stat-label" style="color:#fff; margin-top:2px;">REF SPEED</div>
            </div>
            <div class="stat-box">
                <div class="stat-label"><i class="fas fa-users"></i></div>
                <div class="stat-value">-</div>
                <div class="stat-label" style="color:#fff; margin-top:2px;">TEAM</div>
            </div>
        </div>

        <!-- Progress Bar -->
        <div class="progress-section">
            <div class="progress-header">
                <div class="next-level"><i class="fas fa-rocket"></i> Next: Golden Spark</div>
                <div class="reward">200 BDC</div>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill"></div>
            </div>
            <div class="progress-footer">Reward: 1 BDC</div>
        </div>

        <!-- Social Code Section -->
        <div class="social-section">
            <div class="social-label"><i class="fas fa-code"></i> PASTE SOCIAL CODE</div>
            <div class="social-input-group">
                <input type="text" placeholder="Paste Code">
                <button>• CLAIM</button>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <div class="bottom-nav">
            <div class="nav-btn">
                <i class="fas fa-clipboard-list"></i> TASKS
            </div>
            <div class="nav-btn active">
                <i class="fas fa-pickaxe"></i> MINING
            </div>
            <div class="nav-btn">
                <i class="fas fa-gift"></i> REFERRAL
            </div>
        </div>

    </div>

</body>
</html>
